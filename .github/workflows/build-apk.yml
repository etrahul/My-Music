name: My Music

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: My Music
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets (www/index.html)
        run: |
          mkdir -p www
          if [ -f "my_music.html" ]; then
            cp my_music.html www/index.html
          elif [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ ! -f "www/index.html" ]; then
            echo "Error: Please place my_music.html or index.html in the repository root!"
            exit 1
          fi

      - name: Initialize Capacitor Config & Dependencies
        run: |
          if [ ! -f "package.json" ]; then
            cat << 'EOF' > package.json
          {
            "name": "my-music",
            "version": "1.0.0",
            "description": "My Music",
            "private": true
          }
          EOF
          fi

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mymusic.player",
            "appName": "My Music",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": [
                "*.youtube.com",
                "*.ytimg.com",
                "*.googlevideo.com",
                "*.googleapis.com",
                "*.peerjs.com"
              ]
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Add & Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Set App Name to "My Music" & Configure Android Permissions
        run: |
          STRINGS_XML="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_XML" ]; then
            cat << 'EOF' > "$STRINGS_XML"
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">My Music</string>
              <string name="title_activity_main">My Music</string>
              <string name="package_name">com.mymusic.player</string>
              <string name="custom_url_scheme">com.mymusic.player</string>
          </resources>
          EOF
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' "$MANIFEST"

            if ! grep -q "android.permission.MODIFY_AUDIO_SETTINGS" "$MANIFEST"; then
              sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n<\/manifest>/g' "$MANIFEST"
            fi
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build & Sign "My Music" APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease

          keytool -genkey -v \
            -keystore my-music-release.keystore \
            -alias mymusic \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mymusic123 \
            -keypass mymusic123 \
            -dname "CN=My Music, OU=Mobile, O=MyMusic, L=Dumka, S=Jharkhand, C=IN"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/My Music.apk"

          if [ -f "$UNSIGNED_APK" ]; then
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
            ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)

            $ZIPALIGN -v -p 4 "$UNSIGNED_APK" "app/build/outputs/apk/release/app-release-aligned.apk"
            $APKSIGNER sign \
              --ks my-music-release.keystore \
              --ks-key-alias mymusic \
              --ks-pass pass:mymusic123 \
              --key-pass pass:mymusic123 \
              --out "$SIGNED_APK" \
              "app/build/outputs/apk/release/app-release-aligned.apk"
          fi

      - name: Prepare Output APK
        run: |
          mkdir -p apk-output
          if [ -f "android/app/build/outputs/apk/release/My Music.apk" ]; then
            cp "android/app/build/outputs/apk/release/My Music.apk" "apk-output/My Music.apk"
          fi

      - name: Upload My Music APK
        uses: actions/upload-artifact@v4
        with:
          name: My Music
          path: apk-output/My Music.apk
          if-no-files-found: error
          retention-days: 30
